services:
  admin-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5001}
    container_name: water-purifier-admin
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - HOSTNAME=0.0.0.0
